spring.application.name=Connect-backend

# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/CHAT_APP?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}

spring.datasource.username=${DB_USERNAME:root}

spring.datasource.password=${DB_PASSWORD:root}


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

spring.jpa.show-sql=${SHOW_SQL:false}

spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET:YourLongRandomSecretKeyForConnectApplication2026@SpringBoot}

jwt.expiration=${JWT_EXPIRATION:604800000}


# =========================================================
# FILE UPLOAD
# =========================================================

spring.servlet.multipart.max-file-size=12MB

spring.servlet.multipart.max-request-size=12MB


# =========================================================
# SERVER
# =========================================================

server.port=${PORT:8080}