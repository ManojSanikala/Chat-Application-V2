<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chat Application</title>


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- Google Font -->

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =========================================
           GLOBAL
        ========================================= */

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family: "Inter", sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #2196f3,
                    #1565c0
                );

            padding: 20px;

        }


        /* =========================================
           CARD
        ========================================= */

        .auth-card {

            width: 420px;

            max-width: 100%;

            background: white;

            padding: 40px;

            border-radius: 16px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, .25);

        }


        /* =========================================
           LOGO
        ========================================= */

        .logo {

            width: 70px;

            height: 70px;

            margin: auto;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #2196f3;

            color: white;

            font-size: 30px;

        }


        /* =========================================
           HEADINGS
        ========================================= */

        h1 {

            text-align: center;

            margin: 20px 0 5px;

            color: #222;

            font-size: 25px;

        }


        .subtitle {

            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 30px;

        }


        /* =========================================
           INPUT
        ========================================= */

        .input-group {

            margin-bottom: 18px;

        }


        .input-group label {

            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            font-weight: 600;

            color: #444;

        }


        .input-box {

            display: flex;

            align-items: center;

            border: 1px solid #ddd;

            border-radius: 9px;

            padding: 0 12px;

            transition: 0.2s;

        }


        .input-box:focus-within {

            border-color: #2196f3;

            box-shadow:
                0 0 0 3px
                rgba(33, 150, 243, 0.12);

        }


        .input-box i {

            color: #777;

            width: 20px;

        }


        .input-box input {

            width: 100%;

            border: none;

            outline: none;

            padding: 13px 10px;

            font-size: 14px;

            font-family: inherit;

        }


        /* =========================================
           BUTTON
        ========================================= */

        .submit-button {

            width: 100%;

            border: none;

            border-radius: 9px;

            padding: 14px;

            background: #2196f3;

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            margin-top: 5px;

            transition: 0.2s;

        }


        .submit-button:hover {

            background: #1976d2;

        }


        .submit-button:disabled {

            background: #90caf9;

            cursor: not-allowed;

        }


        /* =========================================
           MESSAGE
        ========================================= */

        .message {

            display: none;

            margin-top: 15px;

            padding: 10px;

            border-radius: 7px;

            font-size: 13px;

            text-align: center;

        }


        .error-message {

            background: #ffebee;

            color: #c62828;

        }


        .success-message {

            background: #e8f5e9;

            color: #2e7d32;

        }


        /* =========================================
           SWITCH
        ========================================= */

        .switch-auth {

            text-align: center;

            margin-top: 22px;

            font-size: 14px;

            color: #666;

        }


        .switch-auth button {

            border: none;

            background: transparent;

            color: #2196f3;

            font-weight: 600;

            cursor: pointer;

            font-size: 14px;

            padding: 0;

            margin-left: 4px;

        }


        .switch-auth button:hover {

            text-decoration: underline;

        }


        /* =========================================
           HIDDEN
        ========================================= */

        .hidden {

            display: none !important;

        }


        /* =========================================
           PASSWORD RULE
        ========================================= */

        .password-note {

            color: #888;

            font-size: 11px;

            margin-top: 5px;

        }

    </style>

</head>


<body>


<div class="auth-card">


    <!-- =========================================
         LOGO
    ========================================= -->

    <div class="logo">

        <i class="fa-solid fa-comments"></i>

    </div>


    <!-- =========================================
         LOGIN TITLE
    ========================================= -->

    <div id="loginHeader">

        <h1>
            Welcome Back
        </h1>

        <div class="subtitle">
            Sign in to your chat account
        </div>

    </div>


    <!-- =========================================
         SIGNUP TITLE
    ========================================= -->

    <div
        id="signupHeader"
        class="hidden"
    >

        <h1>
            Create Account
        </h1>

        <div class="subtitle">
            Join and start chatting today
        </div>

    </div>


    <!-- =========================================
         LOGIN FORM
    ========================================= -->

    <form id="loginForm">


        <!-- USERNAME -->

        <div class="input-group">

            <label>
                Username
            </label>


            <div class="input-box">

                <i class="fa-solid fa-user"></i>


                <input
                    type="text"
                    id="loginUsername"
                    placeholder="Enter username"
                    required
                >

            </div>

        </div>


        <!-- PASSWORD -->

        <div class="input-group">

            <label>
                Password
            </label>


            <div class="input-box">

                <i class="fa-solid fa-lock"></i>


                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter password"
                    required
                >

            </div>

        </div>


        <!-- LOGIN BUTTON -->

        <button
            id="loginButton"
            class="submit-button"
            type="submit"
        >

            <i class="fa-solid fa-right-to-bracket"></i>

            &nbsp;

            Login

        </button>


    </form>


    <!-- =========================================
         SIGNUP FORM
    ========================================= -->

    <form
        id="signupForm"
        class="hidden"
    >


        <!-- USERNAME -->

        <div class="input-group">

            <label>
                Username
            </label>


            <div class="input-box">

                <i class="fa-solid fa-user"></i>


                <input
                    type="text"
                    id="signupUsername"
                    placeholder="Choose a username"
                    required
                >

            </div>

        </div>


        <!-- PASSWORD -->

        <div class="input-group">

            <label>
                Password
            </label>


            <div class="input-box">

                <i class="fa-solid fa-lock"></i>


                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    minlength="8"
                    required
                >

            </div>


            <div class="password-note">

                Password must contain at least 8 characters.

            </div>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="input-group">

            <label>
                Confirm Password
            </label>


            <div class="input-box">

                <i class="fa-solid fa-lock"></i>


                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="8"
                    required
                >

            </div>

        </div>


        <!-- SIGNUP BUTTON -->

        <button
            id="signupButton"
            class="submit-button"
            type="submit"
        >

            <i class="fa-solid fa-user-plus"></i>

            &nbsp;

            Create Account

        </button>


    </form>


    <!-- =========================================
         ERROR MESSAGE
    ========================================= -->

    <div
        id="errorMessage"
        class="message error-message"
    ></div>


    <!-- =========================================
         SUCCESS MESSAGE
    ========================================= -->

    <div
        id="successMessage"
        class="message success-message"
    ></div>


    <!-- =========================================
         SWITCH LOGIN / SIGNUP
    ========================================= -->

    <div class="switch-auth">


        <span id="switchText">

            Don't have an account?

        </span>


        <button
            type="button"
            id="switchButton"
        >

            Create Account

        </button>


    </div>


</div>


<script>


/* =========================================
   GET ELEMENTS
========================================= */

const loginForm =
    document.getElementById(
        "loginForm"
    );


const signupForm =
    document.getElementById(
        "signupForm"
    );


const loginHeader =
    document.getElementById(
        "loginHeader"
    );


const signupHeader =
    document.getElementById(
        "signupHeader"
    );


const switchText =
    document.getElementById(
        "switchText"
    );


const switchButton =
    document.getElementById(
        "switchButton"
    );


const errorMessage =
    document.getElementById(
        "errorMessage"
    );


const successMessage =
    document.getElementById(
        "successMessage"
    );


let signupMode = false;


/* =========================================
   HIDE MESSAGES
========================================= */

function hideMessages() {

    errorMessage.style.display =
        "none";


    successMessage.style.display =
        "none";

}


/* =========================================
   SHOW ERROR
========================================= */

function showError(message) {

    successMessage.style.display =
        "none";


    errorMessage.textContent =
        message;


    errorMessage.style.display =
        "block";

}


/* =========================================
   SHOW SUCCESS
========================================= */

function showSuccess(message) {

    errorMessage.style.display =
        "none";


    successMessage.textContent =
        message;


    successMessage.style.display =
        "block";

}


/* =========================================
   SWITCH MODE
========================================= */

switchButton.addEventListener(
    "click",
    function () {


        hideMessages();


        signupMode =
            !signupMode;


        if (signupMode) {


            /* SIGNUP MODE */

            loginForm.classList.add(
                "hidden"
            );


            signupForm.classList.remove(
                "hidden"
            );


            loginHeader.classList.add(
                "hidden"
            );


            signupHeader.classList.remove(
                "hidden"
            );


            switchText.textContent =
                "Already have an account?";


            switchButton.textContent =
                "Sign In";


        }

        else {


            /* LOGIN MODE */

            signupForm.classList.add(
                "hidden"
            );


            loginForm.classList.remove(
                "hidden"
            );


            signupHeader.classList.add(
                "hidden"
            );


            loginHeader.classList.remove(
                "hidden"
            );


            switchText.textContent =
                "Don't have an account?";


            switchButton.textContent =
                "Create Account";


        }


    }
);


/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
    "submit",
    async function (event) {


        event.preventDefault();


        hideMessages();


        const username =
            document
                .getElementById(
                    "loginUsername"
                )
                .value
                .trim();


        const password =
            document
                .getElementById(
                    "loginPassword"
                )
                .value;


        const button =
            document.getElementById(
                "loginButton"
            );


        button.disabled =
            true;


        button.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin"></i> Logging in...';


        try {


            const response =
                await fetch(
                    "/auth/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                {
                                    username: username,
                                    password: password
                                }
                            )
                    }
                );


            const responseText =
                await response.text();


            let data = {};


            if (
                responseText &&
                responseText.trim()
            ) {

                try {

                    data =
                        JSON.parse(
                            responseText
                        );

                }

                catch {

                    throw new Error(
                        "Server returned an invalid response."
                    );

                }

            }


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    data.error ||
                    "Invalid username or password"
                );

            }


            const token =
                data.token;


            if (!token) {

                throw new Error(
                    "JWT token was not returned by server."
                );

            }


            /* SAVE JWT */

            localStorage.setItem(
                "token",
                token
            );


            /* OPEN CHAT */

            window.location.replace(
                "/index.html"
            );


        }

        catch (error) {


            console.error(
                "LOGIN ERROR:",
                error
            );


            showError(
                error.message ||
                "Login failed"
            );


            button.disabled =
                false;


            button.innerHTML =
                '<i class="fa-solid fa-right-to-bracket"></i> &nbsp; Login';

        }


    }
);


/* =========================================
   SIGNUP
========================================= */

signupForm.addEventListener(
    "submit",
    async function (event) {


        event.preventDefault();


        hideMessages();


        const username =
            document
                .getElementById(
                    "signupUsername"
                )
                .value
                .trim();


        const password =
            document
                .getElementById(
                    "signupPassword"
                )
                .value;


        const confirmPassword =
            document
                .getElementById(
                    "confirmPassword"
                )
                .value;


        const button =
            document.getElementById(
                "signupButton"
            );


        /* VALIDATE PASSWORD */

        if (
            password !==
            confirmPassword
        ) {

            showError(
                "Passwords do not match."
            );

            return;

        }


        if (
            password.length < 8
        ) {

            showError(
                "Password must contain at least 8 characters."
            );

            return;

        }


        button.disabled =
            true;


        button.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin"></i> Creating Account...';


        try {


            /* =====================================
               CALL EXISTING BACKEND
               POST /auth/register
            ===================================== */

            const response =
                await fetch(
                    "/auth/register",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                {
                                    username: username,
                                    password: password
                                }
                            )
                    }
                );


            const responseText =
                await response.text();


            let data = {};


            if (
                responseText &&
                responseText.trim()
            ) {

                try {

                    data =
                        JSON.parse(
                            responseText
                        );

                }

                catch {

                    data = {};

                }

            }


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    data.error ||
                    "Registration failed. Username may already exist."
                );

            }


            /* SUCCESS */

            showSuccess(
                "Account created successfully! Please sign in."
            );


            /* CLEAR SIGNUP FORM */

            signupForm.reset();


            /* RETURN TO LOGIN */

            setTimeout(
                function () {


                    signupMode =
                        false;


                    signupForm.classList.add(
                        "hidden"
                    );


                    loginForm.classList.remove(
                        "hidden"
                    );


                    signupHeader.classList.add(
                        "hidden"
                    );


                    loginHeader.classList.remove(
                        "hidden"
                    );


                    switchText.textContent =
                        "Don't have an account?";


                    switchButton.textContent =
                        "Create Account";


                    document
                        .getElementById(
                            "loginUsername"
                        )
                        .focus();


                },
                1500
            );


        }

        catch (error) {


            console.error(
                "SIGNUP ERROR:",
                error
            );


            showError(
                error.message ||
                "Registration failed"
            );

        }

        finally {


            button.disabled =
                false;


            button.innerHTML =
                '<i class="fa-solid fa-user-plus"></i> &nbsp; Create Account';

        }


    }
);


</script>


</body>

</html>
